name: OSify Official Release Pipeline

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag di rilascio (es. v1.5.0)'
        required: false
        default: 'v1.5.0'

permissions:
  contents: write

jobs:
  build-and-release:
    name: Package and Publish OSify Release
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Resolve Release Tag & Metadata
        id: rel_meta
        run: |
          TAG="${{ github.event.inputs.tag || (github.ref_type == 'tag' && github.ref_name) }}"
          if [ -z "$TAG" ]; then
            TAG="v$(cat VERSION 2>/dev/null || echo '1.5.0')"
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "title=OSify $TAG — Hardware Resurrection & Universal OS" >> $GITHUB_OUTPUT

      - name: Set up QEMU for Multi-Arch Container Emulation
        uses: docker/setup-qemu-action@v3

      - name: Install Build Dependencies
        run: |
          sudo dpkg --add-architecture i386 || true
          sudo apt-get update -qq
          sudo apt-get install -y -qq p7zip-full xorriso isolinux syslinux-common syslinux-utils genisoimage python3-pil cpio bash-static:i386 gcc-multilib clang lld || true

      - name: Package Windows Installer & Assets
        run: |
          mkdir -p build/out/release
          bash build/release/package-release.sh

      - name: Generate Clean Wallpapers
        run: |
          python3 tools/branding/generate-osify-wallpapers.py

      - name: Build Bare-Metal ISO (Native Naked-Skin Kernel)
        run: |
          python3 build/build-baremetal-iso.py

      - name: Remaster Hybrid ISOs (32-bit Vintage + 64-bit Modern + ARM64)
        run: |
          sudo python3 build/remaster-live-iso.py --all

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.rel_meta.outputs.tag }}
          name: ${{ steps.rel_meta.outputs.title }}
          draft: false
          prerelease: false
          make_latest: true
          generate_release_notes: true
          files: |
            build/out/release/OSify-*-BareMetal.iso
            build/out/release/OSify-x86_64-v3.iso
            build/out/release/OSify-Vintage-i686.iso
            build/out/release/OSify-ARM64.iso
            build/out/release/OSify-NoUSB-Windows-Installer.zip
            build/out/release/OSify-Windows-Installer.zip
            build/out/release/SHA256SUMS.txt
