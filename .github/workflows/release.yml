name: OSify Official Release Pipeline

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Package and Publish OSify Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Package Windows No-USB Installer
        run: |
          mkdir -p build/out/release
          bash build/release/package-release.sh

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "OSify Official Release ${{ github.ref_name }}"
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            build/out/release/OSify-NoUSB-Windows-Installer.zip
            build/out/release/SHA256SUMS.txt
