name: OSify Official Release Pipeline

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag di rilascio (es. v1.2.0)'
        required: false
        default: 'v1.2.0'

permissions:
  contents: write

jobs:
  build-and-release:
    name: Package and Publish OSify Release
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Build Dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq p7zip-full xorriso isolinux syslinux-utils genisoimage python3-pil cpio

      - name: Package Windows Installer & Assets
        run: |
          mkdir -p build/out/release
          bash build/release/package-release.sh

      - name: Generate Clean Wallpapers
        run: |
          python3 tools/branding/generate-osify-wallpapers.py

      - name: Remaster Hybrid ISOs (32-bit Vintage + 64-bit Modern)
        run: |
          python3 build/remaster-live-iso.py --all

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || (github.ref_type == 'tag' && github.ref_name) || 'v1.2.0' }}
          name: "OSify v1.2.0 — First-Boot OOBE & Hybrid ISOs"
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            build/out/release/OSify-NoUSB-Windows-Installer.zip
            build/out/release/OSify-Windows-Installer.zip
            build/out/release/OSify-x86_64-v3.iso
            build/out/release/OSify-Vintage-i686.iso
            build/out/release/SHA256SUMS.txt
