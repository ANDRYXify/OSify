# OSify - Configurazione PipeWire Pro-Audio a Bassissima Latenza
# Posizione target su sistema: /etc/pipewire/pipewire.conf.d/99-osify-proaudio.conf

context.properties = {
    # Frequenza di campionamento standard broadcast (48 kHz)
    default.clock.rate          = 48000
    default.clock.allowed-rates = [ 48000, 96000 ]

    # Buffer quantizzato a 64 campioni (~1.33 ms di latenza nativa!)
    default.clock.quantum       = 64
    default.clock.min-quantum   = 32
    default.clock.max-quantum   = 256

    # Priorità realtime nel kernel
    cpu.zero.denormals          = true
}

context.modules = [
    # Supporto per priorità Real-Time ad alta precisione
    {   name = libpipewire-module-rt
        args = {
            nice.level   = -20
            rt.prio      = 95
            rt.time.soft = -1
            rt.time.hard = -1
        }
        flags = [ ifexists nofail ]
    }
]
