# OSify - Limiti di sicurezza e priorità Real-Time
# Posizione target su sistema: /etc/security/limits.d/99-osify.conf

# Permette priorità real-time al gruppo realtime e audio (fondamentale per PipeWire sub-3ms)
@realtime   soft    rtprio          98
@realtime   hard    rtprio          98
@realtime   soft    memlock         unlimited
@realtime   hard    memlock         unlimited

@audio      soft    rtprio          95
@audio      hard    rtprio          95
@audio      soft    memlock         unlimited
@audio      hard    memlock         unlimited

# Permette ai processi utente di allocare memoria bloccata (evita paging per motori grafici e Wine)
*           soft    memlock         unlimited
*           hard    memlock         unlimited

# Massimizza i file aperti (file descriptors) per evitare crash in Wine, Proton ed emulatori
*           soft    nofile          524288
*           hard    nofile          1048576

# Priorità nice per scheduler BORE
*           soft    nice            -20
*           hard    nice            -20
