# OSify - Ottimizzazioni Kernel a Basso Livello
# Posizione target su sistema: /etc/sysctl.d/99-osify.conf

# ==============================================================================
# GESTIONE DELLA MEMORIA & VIRTUAL MEMORY (VM)
# ==============================================================================
# Riduce la tendenza del kernel a scaricare pagine anonime sullo swap
vm.swappiness = 10

# Mantiene in cache i metadati del filesystem (dentry/inode) per caricamenti istantanei
vm.vfs_cache_pressure = 50

# Previene stalli I/O durante la scrittura su disco: limita i dirty bytes massimi
vm.dirty_background_bytes = 67108864
vm.dirty_bytes = 268435456

# FONDAMENTALE per Proton (Wine), giochi DirectX moderni ed emulatori (RPCS3, Ryujinx)
# Previene crash per esaurimento delle Virtual Memory Areas (VMA)
vm.max_map_count = 2147483642

# Migliora la gestione della memoria per carichi intensivi
vm.compaction_proactiveness = 20
vm.page_lock_unfairness = 1

# ==============================================================================
# CPU SCHEDULING & LATENZA INTERATTIVA
# ==============================================================================
# Disabilita la mitigazione Split-Lock del kernel Linux.
# CRITICO: Molti giochi ed emulatori eseguono accessi di memoria non allineati che scatenano split-lock.
# Senza questo flag, il kernel strozza deliberatamente il processo per 10ms, distruggendo il frame-rate.
kernel.split_lock_mitigate = 0

# Aumenta il numero massimo di file descriptor aperti contemporaneamente
fs.file-max = 2097152
fs.inotify.max_user_watches = 524288
fs.inotify.max_user_instances = 8192

# ==============================================================================
# RETE A BASSISSIMA LATENZA & ANTI-BUFFERBLOAT
# ==============================================================================
# Imposta CAKE (Common Applications Kept Enhanced) come algoritmo di accodamento predefinito
net.core.default_qdisc = cake

# Abilita Google BBR (Bottleneck Bandwidth and RTT) per massimizzare il throughput senza accumulo di buffer
net.ipv4.tcp_congestion_control = bbr

# Abilita TCP Fast Open sia in invio che in ricezione per azzerare handshake ridondanti
net.ipv4.tcp_fastopen = 3

# Dimensioni dei buffer socket di rete ottimizzati per flussi streaming 1080p/4K e gaming
net.core.rmem_max = 16777216
net.core.wmem_max = 16777216
net.core.rmem_default = 1048576
net.core.wmem_default = 1048576
net.ipv4.tcp_rmem = 4096 1048576 16777216
net.ipv4.tcp_wmem = 4096 1048576 16777216

# Riduce i timeout per connessioni inattive
net.ipv4.tcp_fin_timeout = 15
net.ipv4.tcp_keepalive_time = 300
net.ipv4.tcp_keepalive_intvl = 15
net.ipv4.tcp_keepalive_probes = 5

# Abilita TCP Low Latency per privilegiare il tempo di risposta rispetto al throughput cumulativo
net.ipv4.tcp_low_latency = 1
