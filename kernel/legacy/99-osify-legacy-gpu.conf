# OSify - Abilitazione Driver Grafici per GPU Legacy
# Posizione target su sistema: /etc/modprobe.d/99-osify-legacy-gpu.conf

# ==============================================================================
# SBLOCCO VULKAN & DRIVER MODERNO PER VECCHIE GPU AMD RADEON
# ==============================================================================
# Le vecchie schede grafiche AMD (serie HD 7000, HD 8000, R7 200, R9 200/300)
# basate su architettura GCN 1.0 (Southern Islands) e GCN 2.0 (Sea Islands)
# usano storicamente il driver obsoleto 'radeon' che NON supporta Vulkan.
#
# Queste opzioni forzano il kernel a usare il driver moderno 'amdgpu',
# resuscitando schede di 10-14 anni fa e regalando loro il supporto a VULKAN e DXVK!
options radeon si_support=0
options amdgpu si_support=1
options radeon cik_support=0
options amdgpu cik_support=1

# ==============================================================================
# GPU INTEL VINTAGE (Sandy Bridge / Ivy Bridge HD 2000 / 3000 / 4000)
# ==============================================================================
# Abilita accelerazione hardware stabile e previene crash di rendering
options i915 enable_fbc=1
options i915 fastboot=1

# ==============================================================================
# GPU NVIDIA VINTAGE & DRIVER OPEN-SOURCE NOUVEAU
# ==============================================================================
# Abilita il reclocking dinamico delle frequenze su GPU Nvidia supportate
options nouveau config=NvGsp=0
